[project]
name = "grafana-prometheus-dashboard-example"
version = "0.1.0"
description = "FastAPI, Prometheus and Grafana dashboard example from XNova"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "prometheus-client==0.25.0",
  "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["ANN", "B", "C90", "E", "F", "I", "RUF", "SIM", "UP"]
